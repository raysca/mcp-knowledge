<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How hybrid ranking works</title>
  <desc id="desc">A query and its filters run through vector and lexical search in parallel. Reciprocal-rank fusion combines both candidate lists into final ranked chunks with provenance and timing.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#667085"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,monospace}.title{fill:#17202b;font-size:30px;font-weight:600;letter-spacing:-.6px}.sub{fill:#5e6876;font-size:15px}.cap{fill:#087f6d;font-size:12px}.head{fill:#17202b;font-size:17px;font-weight:600}.copy{fill:#5e6876;font-size:13px}.small{fill:#667085;font-size:12px}.value{fill:#17202b;font-size:13px}.line{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="18" fill="#f7f9fb"/>
  <text class="sans title" x="48" y="54">How hybrid ranking works</text><text class="sans sub" x="48" y="82">Meaning and exact language compete in parallel; a transparent formula combines their ranks.</text>
  <g transform="translate(48 140)"><text class="mono cap" y="0">01 · ASK</text><rect y="22" width="226" height="126" rx="12" fill="#f2f5f7" stroke="#d8dee5"/><text class="sans head" x="18" y="55">Query + filters</text><text class="sans copy" x="18" y="84">“refund for opened hardware”</text><text class="mono small" x="18" y="111">collection · document</text><text class="mono small" x="18" y="132">metadata · result limit</text></g>
  <path class="line" d="M274 225H319V179H350"/><path class="line" d="M319 225V365H350"/>
  <g transform="translate(350 112)"><text class="mono cap" y="0">02A · MEANING</text><rect y="22" width="270" height="148" rx="12" fill="#f2f5f7" stroke="#d8dee5"/><text class="sans head" x="18" y="55">Vector search</text><text class="sans copy" x="18" y="79">Local MiniLM query embedding</text><line x1="18" y1="94" x2="252" y2="94" stroke="#d8dee5"/><text class="mono small" x="18" y="118">#1 warranty-terms.pdf</text><text class="mono value" x="224" y="118" text-anchor="end">0.81</text><text class="mono small" x="18" y="143">#2 returns-policy.html</text><text class="mono value" x="224" y="143" text-anchor="end">0.79</text></g>
  <g transform="translate(350 298)"><text class="mono cap" y="0">02B · EXACT LANGUAGE</text><rect y="22" width="270" height="148" rx="12" fill="#f2f5f7" stroke="#d8dee5"/><text class="sans head" x="18" y="55">Lexical search</text><text class="sans copy" x="18" y="79">FTS5 matches terms and phrases</text><line x1="18" y1="94" x2="252" y2="94" stroke="#d8dee5"/><text class="mono small" x="18" y="118">#1 returns-policy.html</text><text class="mono value" x="252" y="118" text-anchor="end">12.4</text><text class="mono small" x="18" y="143">#7 warranty-terms.pdf</text><text class="mono value" x="252" y="143" text-anchor="end">4.1</text></g>
  <path class="line" d="M620 208H660V260H696"/><path class="line" d="M620 394H660V312H696"/>
  <g transform="translate(696 204)"><text class="mono cap" y="0">03 · COMBINE</text><rect y="22" width="206" height="160" rx="12" fill="#e8f7f3" stroke="#7cc8ba"/><text class="sans head" x="18" y="56">Rank fusion</text><text class="sans copy" x="18" y="82">RRF rewards agreement</text><rect x="18" y="101" width="170" height="36" rx="7" fill="#ffffff" stroke="#7cc8ba"/><text class="mono value" x="103" y="124" text-anchor="middle">Σ 1 / (60 + rank)</text><text class="mono small" x="18" y="158">no opaque reranker</text></g>
  <path class="line" d="M902 306H940"/>
  <g transform="translate(940 112)"><text class="mono cap" y="0">04 · INSPECT</text><rect y="22" width="212" height="336" rx="12" fill="#f2f5f7" stroke="#d8dee5"/><text class="sans head" x="18" y="55">Ranked chunks</text><g transform="translate(14 77)"><rect width="184" height="96" rx="8" fill="#ffffff" stroke="#7cc8ba"/><text class="mono cap" x="12" y="23">FINAL #1</text><text class="sans value" x="12" y="47">returns-policy.html</text><text class="mono small" x="12" y="70">vector #2 · lexical #1</text><text class="mono cap" x="12" y="88">RRF 0.0325</text></g><g transform="translate(14 185)"><rect width="184" height="96" rx="8" fill="#ffffff" stroke="#d8dee5"/><text class="mono small" x="12" y="23">FINAL #2</text><text class="sans value" x="12" y="47">warranty-terms.pdf</text><text class="mono small" x="12" y="70">vector #1 · lexical #7</text><text class="mono small" x="12" y="88">RRF 0.0313</text></g><text class="mono small" x="18" y="307">source · page · section</text><text class="mono small" x="18" y="328">matched terms · timings</text></g>
  <rect x="48" y="515" width="854" height="58" rx="10" fill="#f2f5f7" stroke="#d8dee5"/><circle cx="72" cy="544" r="4" fill="#087f6d"/><text class="sans value" x="88" y="540">The result order comes from two visible ranks—not an LLM decision.</text><text class="sans small" x="88" y="560">Run vector, lexical, or hybrid mode in the Playground to see which path carries the query.</text>
</svg>
