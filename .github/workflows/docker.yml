name: build-test-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun scripts/release/validate-scale-reports.ts
      - run: bun test

  # Builds the real Dockerfile for both platforms and boots each one (online
  # and fully offline) via scripts/release/smoke.ts - this is what actually
  # would have caught the missing-nested-node_modules bug (drizzle-orm,
  # fast-glob, adm-zip): the container crashes on startup before /health ever
  # responds, so wait_for_health fails and this job fails, before anything is
  # ever pushed. Runs on every push and PR, not just before a publish.
  platform-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: docker/setup-buildx-action@v3
      - run: bun run release:test-platforms

  publish:
    needs: [test, platform-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # QEMU lets the amd64 GitHub runner cross-build the arm64 image below -
      # without this, buildx silently only builds for the runner's own
      # platform and the resulting manifest has no arm64 entry to pull.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/raysca/mcp-knowledge
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
